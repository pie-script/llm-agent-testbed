<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>LLM security testbed architecture</title>
<desc>Structural diagram showing how an attack prompt flows through the AI model, into one of two swappable tool implementations, and into the fake backend data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="460" fill="#ffffff"/>

<g>
<rect x="240" y="20" width="200" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Attack prompt</text>
<text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Sent as a normal user message</text>
</g>
<line x1="340" y1="76" x2="340" y2="112" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="220" y="112" width="240" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Gemini (the model)</text>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Decides whether to call a tool</text>
</g>
<line x1="340" y1="168" x2="340" y2="200" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="200" width="560" height="140" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="222" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Swappable tool layer</text>
<text x="80" y="238" font-family="sans-serif" font-size="12" fill="#5F5E5A">Same interface, different code behind it</text>

<g>
<rect x="90" y="256" width="230" height="64" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="205" y="276" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#791F1F">Naive tool</text>
<text x="205" y="294" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#A32D2D">Zero checks -- returns</text>
<text x="205" y="308" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#A32D2D">everything asked for</text>
</g>

<g>
<rect x="360" y="256" width="230" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="475" y="276" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Hardened tool</text>
<text x="475" y="294" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Refuses restricted rows,</text>
<text x="475" y="308" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">never returns password</text>
</g>

<line x1="205" y1="320" x2="205" y2="360" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="475" y1="320" x2="475" y2="360" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="150" y="360" width="380" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="382" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Fake backend data</text>
<text x="340" y="400" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">alice (open) and admin (restricted), with a real fake password</text>
</g>
</svg>
