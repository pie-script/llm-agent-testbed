<rect x="520" y="218" width="120" height="28" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="580" y="232" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">Unclear</text>

