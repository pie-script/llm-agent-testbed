<svg width="680" height="240" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Attack 5: chained request</title>
<desc>A two-turn conversation: turn one confirms tool availability, turn two asks for the full record under an audit trail framing. Naive tool leaks on turn two. Hardened tool refuses before the tool is ever called, on both attempts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="240" fill="#ffffff"/>
<rect x="140" y="20" width="400" height="50" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340.0" y="36.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Chained request (2 turns)</text>
<text x="340.0" y="53.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Turn 1 confirms capability, turn 2 asks for the record</text>
<line x1="240" y1="70" x2="170" y2="106" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440" y1="70" x2="510" y2="106" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="106" width="220" height="46" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="170.0" y="120.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#791F1F">Naive: LEAKED</text>
<text x="170.0" y="137.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#791F1F">Tool called on turn 2</text>
<rect x="400" y="106" width="220" height="46" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="510.0" y="120.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Hardened: UNCLEAR</text>
<text x="510.0" y="137.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">Model refused pre-tool, both tries</text>
<text x="340" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">The only asymmetric pair -- the hardened tool's code was never actually exercised here</text>
<text x="340" y="208" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Kept as-is rather than re-rolled until a cleaner match appeared</text>
</svg>